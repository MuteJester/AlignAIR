[build-system]
requires = ["setuptools>=77.0", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

# ── Project metadata (PEP 621) ──────────────────────────────────────────────
[project]
name = "AlignAIR"
version = "3.0.0"
description = "End-to-end neural aligner for immunoglobulin and T-cell-receptor V(D)J sequences, with standard AIRR output"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Thomas Konstantinovsky", email = "thomaskon90@gmail.com" },
    { name = "Ayelet Peres" },
]
keywords = ["immunogenetics", "sequence-alignment", "bioinformatics", "AIRR", "antibody", "TCR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# ── Core dependencies ────────────────────────────────────────────────────────
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "GenAIRR>=2.2.0",
    "safetensors>=0.4",       # portable weights section of the .alignair model format
    "scipy>=1.11",
    "PyYAML>=6.0",
    "biopython>=1.80",
    "platformdirs>=3.0",     # per-OS cache/config locations (cross-platform, honors XDG/env overrides)
    "tomli>=2; python_version < '3.11'",   # tomllib backport: runtime TOML registry-config reader on Python 3.10
]

# ── Optional extras ──────────────────────────────────────────────────────────
[project.optional-dependencies]
zstd = ["zstandard>=0.22"]    # optional stronger compression for .alignair sections (codec="zstd")
# Only needed for PRIVATE hf:// repos or resumable large downloads. file://, https://, and PUBLIC
# hf:// registries + the verified cache all work with the stdlib alone (no extra install).
hub = ["huggingface-hub>=0.20"]
cli = [
    "huggingface-hub>=0.20",
    # gapped alignment (exact cigars / germline_alignment / identity) + fast V reader. parasail ships
    # no arm64-macOS wheel and would try to compile, so it is excluded on Apple Silicon; there the
    # Biopython fallback in align/ is used instead. Installed everywhere a binary wheel exists.
    "parasail>=1.3; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "argcomplete>=3.0",    # optional shell completion (`alignair completion`)
]
# alias kept for back-compat; parasail is now part of [cli]
reader = [
    "parasail>=1.3; platform_system != 'Darwin' or platform_machine != 'arm64'",
]
# WFA2 wavefront aligner: fast exact germline alignment for the speed-stack inference path
# (the align/ package prefers it, falling back to parasail when absent).
wfa = [
    "pywfa>=0.5",
]
train = [
    "wandb>=0.15",
    "matplotlib>=3.7",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.9",
]
server = [
    "flask>=3.0",
    "requests>=2.28",
]
test = [
    "pytest>=7.0",
    "airr>=1.4",           # official AIRR schema validation in acceptance/interop tests
    "jinja2>=3.0",         # conda recipe rendering tests
    "pytest-cov>=4.1",     # statement/branch evidence and CI artifacts
    "pytest-timeout>=2.2", # bound test and fixture hangs, including concurrency tests
    "pytest-xdist>=3.5",   # verify component tests in separate concurrent workers
]
test-research = [
    "AlignAIR[test]",
    "pyhmmer==0.12.1",     # deterministic AA profile fixtures; matches the research toolchain
    "scikit-learn>=1.0",   # AA applicability scorer tests
]
dev = [
    "AlignAIR[cli,train,viz,server,test-research]",
    "build>=1.0",
    "twine>=5.0",
    "cibuildwheel>=2.21",  # build binary wheels (with the compiled germline-CIGAR kernel) locally
]
all = [
    "AlignAIR[cli,train,viz,server]",
]

# ── URLs ─────────────────────────────────────────────────────────────────────
[project.urls]
Homepage = "https://alignair.ai"
Repository = "https://github.com/MuteJester/AlignAIR"
"Bug Tracker" = "https://github.com/MuteJester/AlignAIR/issues"
Documentation = "https://mutejester.github.io/AlignAIR/"

# ── Console scripts ─────────────────────────────────────────────────────────
[project.scripts]
alignair = "alignair.cli.main:main"

# ── Setuptools configuration ────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]
# `alignair_benchmark` is a dev/research harness (GenAIRR benchmark generation + evaluation),
# not part of the runtime product — keep it out of the installed wheel. It stays importable from a
# source checkout (PYTHONPATH=src) for development and CI.
exclude = ["alignair_benchmark*"]

# ship the Cython source so an sdist can (re)build the optional germline-CIGAR kernel
[tool.setuptools.package-data]
"alignair.predict" = ["*.pyx"]

# ── Wheel building (cibuildwheel) ───────────────────────────────────────────
# Builds binary wheels (with the compiled germline-CIGAR kernel) for Linux/macOS/Windows in CI.
# The extension is best-effort: a source install without a compiler still works via the pure-Python
# fallback, so wheels are a speed optimization, not a hard requirement.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
# skip musllinux, 32-bit Linux (i686), and 32-bit Windows (win32) - PyTorch has no wheels there.
skip = "*-musllinux_* *_i686 *-win32"
build-frontend = "build"
# each runner builds its native arch (macos-15-intel -> x86_64, macos-15 -> arm64, etc.) so the
# compiled kernel can be imported + tested in-place. Verify it actually loaded in every built wheel
# (the smoke test loads the extension directly).
# Preinstall a frozen, binary-only scientific stack before cibuildwheel installs AlignAIR. Without
# this, a future SciPy/NumPy release can drop an older manylinux tag, making pip attempt an unrelated
# source build inside the wheel-test container (which has no OpenBLAS) even though AlignAIR's wheel
# itself built correctly. The release smoke later tests normal dependency resolution independently.
before-test = "python -m pip install --only-binary=:all: -r {package}/constraints/cibuildwheel-test.txt"
test-command = "python {project}/tests/packaging/wheel_smoke.py"

# ── Pytest configuration ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Source packages and the private tests.* helper package, including when invoked outside the checkout.
pythonpath = ["src", "."]
# Keep imports independent of test basenames and catch misspelled configuration/markers.
addopts = "--import-mode=importlib --strict-markers --strict-config"
timeout = 300
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "component: Deterministic component contracts, with injected provider inputs where needed",
    "integration: Real simulator, process, serialization, or application integration",
    "acceptance: Public guarantees and release acceptance criteria",
    "claim_evidence: Test referenced by a version-controlled release claim",
    "model_validation: Requires pre-fetched checksum-pinned public model artifacts",
    "performance: Resource-behavior checks with explicit budgets",
    "slow: Slow tests (real model/reference; excluded from fast runs via -m 'not slow')",
    "local_data: Requires optional local model weights or frozen research artifacts; skips when inputs are absent",
]

[tool.coverage.run]
branch = true
source = ["alignair", "alignair_benchmark"]

[tool.coverage.report]
show_missing = true
