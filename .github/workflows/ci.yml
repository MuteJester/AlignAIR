name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # allow manual runs on any branch (e.g. to check the cross-platform matrix)

jobs:
  model-validation:
    uses: ./.github/workflows/model-validation.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch + package + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[cli,test-research]"
      - name: Smoke — CLI is wired
        run: |
          alignair --version
          alignair doctor
      - name: Tests
        run: |
          python -m pytest tests -q --cov=alignair --cov=alignair_benchmark \
            --cov-report=xml:test-results/coverage.xml --cov-report=json:test-results/coverage.json \
            --cov-report=html:test-results/htmlcov --junitxml=test-results/junit.xml
      - name: Critical-file branch and statement coverage
        if: matrix.python-version == '3.12'
        run: python -m tests.support.coverage_gate --coverage test-results/coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results/

  test-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[cli,test-research]"
      - name: Component tests in a reproducible shuffled order
        run: |
          python -m pytest tests -q -m "component and not slow and not local_data and not model_validation" \
            --test-order=shuffle --order-seed=20261026 --junitxml=test-results/shuffled.xml
      - name: Component tests in concurrent isolated workers
        run: |
          python -m pytest tests -q -m "component and not slow and not local_data and not model_validation" \
            -n 2 --junitxml=test-results/parallel.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shuffled-test-results
          path: test-results/

  # The full suite runs on Linux (above). This job proves the package *runs* on macOS + Windows too,
  # exercising the platform-sensitive code paths — cross-process file locking (POSIX flock vs the
  # Windows O_EXCL fallback), atomic os.replace, the .alignair container read/write, CSV newline
  # handling, and path handling. The compiled-wheel-per-OS build is validated separately (wheels.yml).
  crossplatform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash            # identical commands on all three OSes (git-bash on Windows runners)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch + package + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[cli,test]"
      - name: Smoke — CLI is wired
        run: |
          alignair --version
          alignair doctor
      - name: Platform-sensitive tests (I/O, container, registry locking, atomic replace, paths)
        run: python -m pytest -q tests/alignair/io tests/alignair/model_file tests/alignair/registry --junitxml=test-results/platform.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results-${{ matrix.os }}
          path: test-results/

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the built wheel into a clean venv (CPU torch)
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheelenv/bin/pip install "$(ls dist/*.whl)[cli]"
      - name: Release smoke (doctor -> demo -> validate-airr -> compare)
        run: ALIGNAIR=/tmp/wheelenv/bin/alignair sh tests/packaging/release_smoke.sh "$RUNNER_TEMP/wheel_smoke"
      - name: Installed public API contracts outside the checkout
        working-directory: ${{ runner.temp }}
        run: /tmp/wheelenv/bin/python "$GITHUB_WORKSPACE/tests/packaging/installed_contract.py" --forbid-source "$GITHUB_WORKSPACE/src"

  conda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}        # login shell so `conda activate` works
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.11"
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Validate the recipe renders
        run: |
          conda install -y conda-build
          # `conda render` was removed from modern conda; `conda-build --output` renders the recipe
          # (evaluates the Jinja + resolves the output path) without building it. The recipe is a
          # literal, local-source recipe, so this renders identically on conda-build's two passes.
          conda-build conda/ --output
      - name: Conda-env runtime smoke (conda pytorch + pip install + tiny demo)
        run: |
          conda install -y "pytorch>=2.2" "numpy>=1.24" -c conda-forge
          pip install ".[cli]"          # GenAIRR + AlignAIR are PyPI-only for now
          alignair doctor
          alignair reference list
          alignair demo --steps 1 --device cpu -o "$RUNNER_TEMP/conda_demo"
          alignair validate-airr "$RUNNER_TEMP/conda_demo/demo.tsv"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t alignair:ci .
      - name: Smoke — image runs the CLI
        run: |
          docker run --rm alignair:ci --version
          docker run --rm alignair:ci doctor
      - name: Release smoke inside the container (same script as the wheel)
        run: |
          mkdir -p "$RUNNER_TEMP/docker_smoke"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            -e HOME=/out \
            -v "$PWD/tests/packaging/release_smoke.sh:/release_smoke.sh:ro" \
            -v "$RUNNER_TEMP/docker_smoke:/out" \
            alignair:ci /release_smoke.sh /out
